name: Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-debug-apk.yml"

jobs:
  assemble:
    name: Build installable debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle
      - run: chmod +x gradlew
      - name: Prepare secrets env file
        run: |
          if [ ! -f .env ]; then
            printf 'GEMINI_API_KEY=placeholder_not_used\n' > .env
          fi
      - name: Assemble debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache --console=plain 2>&1 | tee build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            build.log
          if-no-files-found: warn
