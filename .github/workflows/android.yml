name: Build Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare secrets env file
        run: |
          if [ ! -f .env ]; then
            printf 'GEMINI_API_KEY=placeholder_not_used\n' > .env
          fi

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Towfik-Exclusive-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
